<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto Bootstrap</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
</head>
<body>
    <header class="bg-primary text-white text-center py-4">
        <h1>Pacheoni Game's</h1>
    </header>

    <div class="container mt-4">
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://images.pexels.com/photos/13189290/pexels-photo-13189290.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" class="d-block w-100" alt="Imagem 1">
                </div>
                <div class="carousel-item">
                    <img src="https://images.pexels.com/photos/4523031/pexels-photo-4523031.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" class="d-block w-100" alt="Imagem 2">
                </div>
                <div class="carousel-item">
                    <img src="https://images.pexels.com/photos/790479/pexels-photo-790479.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" class="d-block w-100" alt="Imagem 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
        <div class="row mt-4">
            <div class="col-md-4 col-sm-6 col-12 mb-3">
                <div class="card">
                    <img src="https://www.notebookcheck.org/fileadmin/Notebooks/News/_nc3/PA5.png" class="card-img-top" alt="Imagem">
                    <div class="card-body">
                        <h5 class="card-title">PlayStation®5</h5>
                        <p class="card-text">PlayStation®5 Slim Disk </p>
                        <a href="#" class="btn btn-primary">Saiba mais</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6 col-12 mb-3">
                <div class="card">
                    <img src="https://th.bing.com/th/id/OIP.FU4JnEnT0ubhsdJZcmruCwHaEK?rs=1&pid=ImgDetMain" class="card-img-top" alt="Imagem">
                    <div class="card-body">
                        <h5 class="card-title">PlayStation®5</h5>
                        <p class="card-text">PlayStation®5 Slim Disk Midnight</p>
                        <a href="#" class="btn btn-primary">Saiba mais</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6 col-12 mb-3">
                <div class="card">
                    <img src="https://th.bing.com/th/id/OIP.y3J_g4_ez3xojTMS_89dpAHaEK?rs=1&pid=ImgDetMain" class="card-img-top" alt="Imagem">
                    <div class="card-body">
                        <h5 class="card-title">Controle PS5</h5>
                        <p class="card-text">Controle DualSense - PlayStation 5</p>
                        <a href="#" class="btn btn-primary">Saiba mais</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container mt-5">
        <h2 class="text-center">Entre em Contato Conosco</h2>
        <form>
        <div>
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required />
        </div>
        <div>
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required />
        </div>
        <div>
            <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" class="form-control" id="telefone" placeholder="Digite seu telefone" required />
        </div><br />
        <button type="submit" class="btn btn-primary">Enviar</button>
        </form><br />
    </div>
    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">&copy; 2025 Pacheoni Game's. Todos os direitos reservados.</p>
    </footer>
    <script src="./bootstrap.bundle.min.js"></script>
</body>
</html>
